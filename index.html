<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Traveler's Quest ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #0a0520;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 900px;
            height: 650px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        #world {
            position: absolute;
            width: 1800px;
            height: 1400px;
            transition: transform 0.1s ease-out;
        }

        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #bg-far {
            background: radial-gradient(circle at 30% 30%, #2d1b69 0%, #0a0520 60%);
        }

        #bg-mid {
            background: radial-gradient(circle at 70% 60%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .ground {
            position: absolute;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f1f3a 100%);
            border: 1px solid rgba(100, 150, 200, 0.3);
        }

        .safe-zone {
            background: linear-gradient(135deg, #2d5016 0%, #1a3010 100%);
            border: 1px solid rgba(100, 200, 100, 0.3);
            box-shadow: 0 0 20px rgba(100, 255, 100, 0.2);
        }

        #title-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(26, 35, 126, 0.98) 0%, rgba(74, 0, 224, 0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        #title-screen h1 {
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 40px rgba(138, 43, 226, 1), 0 0 80px rgba(138, 43, 226, 0.5);
            margin-bottom: 1rem;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 40px rgba(138, 43, 226, 1), 0 0 80px rgba(138, 43, 226, 0.5); }
            50% { text-shadow: 0 0 60px rgba(255, 215, 0, 1), 0 0 120px rgba(255, 215, 0, 0.6); }
        }

        #title-screen p {
            font-size: 1.4rem;
            color: #e0e0e0;
            max-width: 650px;
            text-align: center;
            line-height: 2;
            margin-bottom: 3rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .btn {
            padding: 20px 55px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.7);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 100;
        }

        .player-sprite {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            position: relative;
        }

        .player-sprite::before {
            content: '✨';
            animation: playerPulse 2s ease-in-out infinite;
        }

        @keyframes playerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .player-shield {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid rgba(79, 172, 254, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: shield 1s linear infinite;
        }

        @keyframes shield {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .enemy {
            position: absolute;
            width: 45px;
            height: 45px;
            z-index: 90;
        }

        .enemy-sprite {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff416c 0%, #ff4b2b 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            animation: enemyFloat 2s ease-in-out infinite;
        }

        .enemy-sprite::before {
            content: '👻';
        }

        @keyframes enemyFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .tile {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            animation: tileFloat 3s ease-in-out infinite;
        }

        .tile.gold {
            background: radial-gradient(circle, #ffd700 0%, #ffaa00 100%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .tile.crystal {
            background: radial-gradient(circle, #00ffff 0%, #00cccc 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .tile.star {
            background: radial-gradient(circle, #da22ff 0%, #9733ee 100%);
            box-shadow: 0 0 20px rgba(218, 34, 255, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        @keyframes tileFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(180deg); }
        }

        .obstacle {
            position: absolute;
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            border: 2px solid rgba(100, 100, 150, 0.5);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFade 1.2s ease-out forwards;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        @keyframes particleFade {
            0% { 
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% { 
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            z-index: 500;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(26, 26, 46, 0.95);
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(102, 126, 234, 0.5);
            backdrop-filter: blur(10px);
        }

        #lives {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .heart {
            font-size: 1.5rem;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        #gameover-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #gameover-screen h2 {
            font-size: 4rem;
            color: #ff4444;
            text-shadow: 0 0 40px rgba(255, 68, 68, 1);
            margin-bottom: 1.5rem;
            animation: shakeError 0.5s ease-in-out;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #win-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 100, 0, 0.95) 0%, rgba(0, 50, 100, 0.95) 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #win-screen h2 {
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 0 0 50px rgba(255, 215, 0, 1);
            margin-bottom: 1.5rem;
            animation: victoryPulse 2s ease-in-out infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        #win-screen p, #gameover-screen p {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        .stats {
            background: rgba(0, 0, 0, 0.4);
            padding: 25px 50px;
            border-radius: 20px;
            margin-bottom: 2.5rem;
            font-size: 1.4rem;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .stats div {
            margin: 8px 0;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1rem;
            color: #fff;
            text-align: center;
            border: 2px solid rgba(102, 126, 234, 0.5);
            z-index: 500;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 920px) {
            #game-wrapper {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
        }
